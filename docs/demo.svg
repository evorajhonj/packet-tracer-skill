<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">From a prompt to two-lan-demo.pkt</title>
<desc id="desc">Two routers share the 10.0.0.0/30 transit network. R1 connects to PC1 on 192.168.10.0/24; R2 connects to PC2 on 192.168.20.0/24.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#284258"/></pattern>
  <g id="router" stroke="#ffcc81" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-32 -7v15c0 14 64 14 64 0V-7" fill="#5b432b"/><ellipse cy="-7" rx="32" ry="13" fill="#69492a"/>
    <path d="M-17 -7h12m-4 -4 5 4-5 4m26-4H5m4-4L4-7l5 4" fill="none"/>
  </g>
  <g id="pc" stroke="#73e5cd" stroke-width="2.5" stroke-linejoin="round">
    <rect x="-25" y="-17" width="50" height="31" rx="3" fill="#144a4c"/><path d="M-9 21h18M0 14v7" fill="none"/>
  </g>
</defs>
<rect width="900" height="470" rx="18" fill="#0e2031"/>
<rect y="107" width="900" height="340" fill="url(#grid)"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="35" y="34" fill="#73e5cd" font-size="14" font-weight="700" letter-spacing="2">01  /  PROMPT</text>
<text x="35" y="69" fill="#f1f5f7" font-size="22" font-weight="600">Build two LANs with one PC each. Link the routers over a /30,</text>
<text x="35" y="97" fill="#f1f5f7" font-size="22" font-weight="600">add static routes both ways, and give me the .pkt file.</text>
<path d="M0 118h900" stroke="#395067"/>
<text x="35" y="153" fill="#ffcc81" font-size="14" font-weight="700" letter-spacing="2">02  /  TOPOLOGY</text>
<text x="865" y="153" text-anchor="end" fill="#c2d3dc" font-family="monospace" font-size="17">two-lan-demo.pkt</text>
<g fill="none" stroke-width="3"><path d="M215 232h470" stroke="#ffcc81"/><path d="M215 252v112m470-112v112" stroke="#73e5cd"/></g>
<g text-anchor="middle">
<text x="450" y="214" fill="#ffdc9f" font-family="monospace" font-size="19">10.0.0.0/30</text>
<text x="215" y="197" fill="#fff0d9" font-size="20" font-weight="700">R1</text>
<text x="685" y="197" fill="#fff0d9" font-size="20" font-weight="700">R2</text>
<use href="#router" x="215" y="232"/><use href="#router" x="685" y="232"/>
<use href="#pc" x="215" y="374"/><use href="#pc" x="685" y="374"/>
<text x="215" y="424" fill="#f1f5f7" font-size="20" font-weight="700">PC1</text>
<text x="685" y="424" fill="#f1f5f7" font-size="20" font-weight="700">PC2</text>
<g fill="#bcdbd8" font-family="monospace" font-size="17"><text x="215" y="449">192.168.10.10</text><text x="685" y="449">192.168.20.10</text></g>
</g>
<g fill="#a0eddf" font-family="monospace" font-size="17"><text x="231" y="307">192.168.10.0/24</text><text x="669" y="307" text-anchor="end">192.168.20.0/24</text></g>
</g>
</svg>
